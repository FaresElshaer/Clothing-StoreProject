<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | StyleHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">StyleHub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link active" href="cart.html">Cart <span class="badge bg-warning text-dark cart-count">0</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="page-title">
    <div class="container text-center">
      <h1 class="fw-bold">Shopping Cart</h1>
      <p>Your selected clothing products</p>
    </div>
  </section>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-lg-8">
        <div id="cart-page-items"></div>
      </div>
      <div class="col-lg-4">
        <div class="summary-card">
          <h3 class="fw-bold mb-4">Order Summary</h3>
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <strong>$<span id="subtotal">0</span></strong>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span>Shipping</span>
            <strong>$<span id="shipping">10</span></strong>
          </div>
          <hr>
          <div class="d-flex justify-content-between fs-4">
            <span>Total</span>
            <strong>$<span id="grand-total">0</span></strong>
          </div>
          <button class="btn btn-warning w-100 mt-4" onclick="checkout()">Checkout</button>
          <button class="btn btn-outline-danger w-100 mt-2" onclick="clearCart()">Clear Cart</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">© 2026 StyleHub Clothing Store</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
