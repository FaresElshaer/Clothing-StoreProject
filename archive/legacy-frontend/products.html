<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products | StyleHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">StyleHub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span class="badge bg-warning text-dark cart-count">0</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="page-title">
    <div class="container text-center">
      <h1 class="fw-bold">Clothing Products</h1>
      <p>Men, Women and Accessories Collection</p>
    </div>
  </section>

  <main class="container py-5">
    <div class="row mb-4 g-3">
      <div class="col-md-8">
        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Search for t-shirt, jeans, jacket...">
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select form-select-lg">
          <option value="all">All Categories</option>
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>
    </div>
    <div class="row" id="products-container"></div>
  </main>

  <footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">© 2026 StyleHub Clothing Store</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
